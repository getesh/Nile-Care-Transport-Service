<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Test Model</title>
</head>
<body>

<form th:action="@{/test}" method="post" th:object="${testModel}">
    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}"/>
    <button type="submit">Submit</button>
</form>

<p th:if="${name != null}">Hello, <span th:text="${name}"></span>!</p>

</body>
</html>
